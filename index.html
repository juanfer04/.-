<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Notas Definitivas</title>
  <!-- Ruta relativa para cargar los estilos en despliegues estáticos -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Calculadora de Notas Definitivas</h1>
  </header>

  <main class="app-main">
    <!-- Vista de acceso por documento (HU-1) -->
    <section id="vista-acceso" class="card" aria-label="Acceso de estudiante">
      <h2>Ingreso de estudiante</h2>
      <form id="form-acceso" novalidate>
        <label for="input-documento">Número de documento</label>
        <input
          type="text"
          id="input-documento"
          name="documento"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Ej. 1094881234"
          required
        />
        <button type="submit" id="btn-ingresar">Ingresar</button>
      </form>
      <div id="alerta-acceso" class="alerta" role="alert" aria-live="polite"></div>
    </section>

    <!-- Panel principal del estudiante (HU-1, HU-2, HU-3.1, HU-3.2, HU-3.3) -->
    <section id="vista-panel" class="card oculto" aria-label="Panel de notas">
      <div class="sesion-barra">
        <p>Documento activo: <strong id="documento-activo">-</strong></p>
        <button type="button" id="btn-cerrar-sesion" class="btn-secundario">Cerrar sesión</button>
      </div>

      <!-- Configuración de cantidad y porcentajes (HU-2) -->
      <div class="bloque-configuracion">
        <h2>Configurar evaluaciones</h2>
        <div class="fila-control">
          <label for="input-cantidad-notas">Cantidad de notas (1 a 20)</label>
          <input type="number" id="input-cantidad-notas" min="1" max="20" step="1" />
          <button type="button" id="btn-generar">Generar</button>
        </div>
        <p class="porcentaje-estado">
          Porcentaje acumulado: <strong id="porcentaje-acumulado">0%</strong>
        </p>
        <div id="alerta-panel" class="alerta" role="alert" aria-live="polite"></div>
      </div>

      <!-- Contenedor dinámico para las filas de evaluación -->
      <form id="form-evaluaciones" novalidate>
        <div id="contenedor-evaluaciones" class="contenedor-evaluaciones"></div>
        <button type="submit" id="btn-calcular" class="oculto">Calcular definitiva</button>
      </form>

      <!-- Resultado del cálculo actual (HU-3.1 / HU-3.2) -->
      <section id="seccion-resultado" class="resultado-box oculto" aria-label="Resultado académico">
        <h3>Resultado del cálculo</h3>
        <p>Definitiva: <strong id="valor-definitiva">0.00</strong></p>
        <p>Estado: <strong id="estado-academico">-</strong></p>
        <p id="mensaje-guardado" class="mensaje-estado"></p>
      </section>

      <!-- Historial de cálculos guardado en IndexedDB (HU-3.3) -->
      <section id="seccion-historial" class="historial-box" aria-label="Historial de cálculos">
        <div class="historial-header">
          <h3>Historial de cálculos</h3>
          <button type="button" id="btn-actualizar-historial" class="btn-secundario">
            Actualizar historial
          </button>
        </div>
        <div id="contenedor-historial"></div>
      </section>
    </section>
  </main>

  <!-- Módulo principal ES6 cargado con ruta relativa -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
